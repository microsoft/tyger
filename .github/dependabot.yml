version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directory: "/cli"
    groups:
      go-modules:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/docs"
    groups:
      npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "nuget"
    directories:
      - "/server/Common"
      - "/server/ControlPlane"
      - "/server/ControlPlane.UnitTests"
      - "/server/DataPlane"
    groups:
      nuget:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/cli"
      - "/cli/integrationtest/testconnectivity"
      - "/server"
    groups:
      docker:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
